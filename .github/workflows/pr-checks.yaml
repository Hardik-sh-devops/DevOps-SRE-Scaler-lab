name: Pr Checks

on:
  push:
    branches:
      - working

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 app/

      - name: Install pytest
        run: pip install pytest

      - name: Run unit test
        run: pytest test/

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Testing
        run: bandit -r app/ -s B104 -f json -o bandit-report.json

      - name: Show Bandit findings
        if: always()
        run: cat bandit-report.json

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t scaler:latest .

      - name: Check pip bundled package versions
        run: |
          docker run --rm scaler:latest python -c "
          import pip
          print('pip version:', pip.__version__)
          try:
              from pip._vendor import msgpack
              print('Bundled msgpack:', getattr(msgpack, '__version__', 'unknown'))
          except ImportError as e:
              print('msgpack:', e)
          try:
              from pip._vendor import urllib3
              print('Bundled urllib3:', urllib3.__version__)
          except ImportError as e:
              print('urllib3:', e)
          "
          '
      - name: Run Trivy diagnostic scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scaler:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-diagnostic-report
          path: trivy-report.json
      
      - name: Inspect Trivy package metadata
        run: |
          jq '
            .Results[]? as $r |
            $r.Vulnerabilities[]? |
            select(
              .PkgName == "msgpack" or
              .PkgName == "setuptools" or
              .PkgName == "urllib3"
            ) |
            {
              Target: $r.Target,
              Class: $r.Class,
              Type: $r.Type,
              Package: .PkgName,
              InstalledVersion: .InstalledVersion,
              FixedVersion: .FixedVersion,
              VulnerabilityID: .VulnerabilityID,
              PkgIdentifier: .PkgIdentifier,
              PrimaryURL: .PrimaryURL
            }
          ' trivy-report.json