name: Pr Checks

on:
  push:
    branches:
      - working

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 app/

      - name: Install pytest
        run: pip install pytest

      - name: Run unit test
        run: pytest test/

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Testing
        run: bandit -r app/ -s B104 -f json -o bandit-report.json

      - name: Show Bandit findings
        if: always()
        run: cat bandit-report.json

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t scaler:latest .

      - name: Inspect Python packages
        run: |
          docker image inspect scaler:latest --format '{{.Id}}'
          docker run --rm scaler:latest python -m pip list
          docker run --rm scaler:latest python -c "import importlib.metadata as m; print([(p, m.version(p)) for p in ['msgpack', 'setuptools', 'urllib3'] if any(d.metadata['Name'].lower() == p for d in m.distributions())])"

      - name: Run Trivy diagnostic scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scaler:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-diagnostic-report
          path: trivy-report.json
      

      

      
      
