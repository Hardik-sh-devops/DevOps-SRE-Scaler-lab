name: Pr Checks

on:
  push:
    branches:
      - working

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 app/

      - name: Install pytest
        run: pip install pytest

      - name: Run unit test
        run: pytest test/

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Testing
        run: bandit -r app/ -s B104 -f json -o bandit-report.json

      - name: Show Bandit findings
        if: always()
        run: cat bandit-report.json

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t scaler:latest .

      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scaler:latest
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Create Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if gh pr view "$BRANCH_NAME" --base main >/dev/null 2>&1; then
            echo "Pull request already exists."
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Security-approved: $BRANCH_NAME" \
              --body "Automatically created after all security and quality gates passed."
          fi