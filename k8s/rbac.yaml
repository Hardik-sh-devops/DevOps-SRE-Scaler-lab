
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler-sa
  namespace: scaler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaler-role
  namespace: scaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["scaler-config"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-role-binding
  namespace: scaler
subjects:
  - kind: ServiceAccount
    name: scaler-sa
    namespace: scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaler-role
