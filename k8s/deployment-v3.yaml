apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-v3
  namespace: scaler
  labels:
    app: scaler
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaler
      version: v3
  template:
    metadata:
      labels:
        app: scaler
        version: v3
    spec:
      serviceAccountName: scaler-sa
      containers:
        - name: scaler
          image: ghcr.io/Hardik-sh-devops/scaler:v1.0.2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: scaler-config
            - secretRef:
                name: scaler-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "400Mi"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
      initContainers:
        - name: preflight
          image: busybox:1.36.1
          command: ["sh", "-c", "test -d /tmp"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          